name: Check installer
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: sudo apt-get update && sudo apt-get install -y desktop-file-utils
      - run: bash -n bootstrap.sh setup.sh install.sh scripts/install-deps.sh scripts/wsl-notes-ime.sh
      - run: pip install -r vault-templates/cmc/scripts/requirements.txt
      - run: python3 -m unittest discover -s tests -v
      - run: python3 -m py_compile scripts/tools.py scripts/setup.py scripts/doctor.py scripts/install.py
      - run: ./install.sh --plan
      - run: ./setup.sh --plan
      - run: ./setup.sh --plan --profile cmc
      - run: python3 scripts/vault.py --plan
      - run: python3 scripts/tools.py --plan
      - run: ./setup.sh --plan --no-tools
